services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sylla_predict
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sylla_predict"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN}
      SPORTMONKS_API_URL: ${SPORTMONKS_API_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_TIMEOUT: ${SPORTMONKS_TIMEOUT:-30}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/sylla_predict
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
