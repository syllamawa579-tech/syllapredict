services:
  - type: web
    name: sylla-predict-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sylla-predict-db
          property: connectionString
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: SPORTMONKS_API_URL
        value: https://api.sportmonks.com/v3/football
      - key: SPORTMONKS_TIMEOUT
        value: "30"
  - type: web
    name: sylla-predict
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
databases:
  - name: sylla-predict-db
    plan: free
    databaseName: sylla_predict
    user: sylla_predict
